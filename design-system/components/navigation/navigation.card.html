<!-- @dsCard group="Components" viewport="700x320" name="Navigation — Sidebar & TopBar" subtitle="Flat workspace sidebar + thin header" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style> body { margin: 0; background: var(--canvas); } </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Sidebar, NavItem, NavSection, TopBar, Button, Avatar } = window.StreamLineDesignSystem_132b60;
  const Ic = ({ n, s = 17 }) => {
    const ref = React.useRef(null);
    React.useEffect(() => { if (ref.current) ref.current.innerHTML = ""; const el = window.lucide.createElement(window.lucide.icons[n]); el.setAttribute("width", s); el.setAttribute("height", s); ref.current.appendChild(el); }, [n]);
    return <span ref={ref} style={{ display: "inline-flex" }} />;
  };
  function Demo() {
    const [tab, setTab] = React.useState("schedule");
    return (
      <div style={{ display: "flex", height: 320 }}>
        <Sidebar
          header={<div style={{ display: "flex", alignItems: "center", gap: 9 }}><img src="../../assets/logo.png" style={{ width: 26, height: 26, borderRadius: 6 }} /><span style={{ fontWeight: 600, fontSize: 15, color: "var(--ink)" }}>Stream Line</span></div>}
          footer={<div style={{ display: "flex", alignItems: "center", gap: 8 }}><Avatar name="Yael Admin" size={26} /><span style={{ fontSize: 13, color: "var(--ink-mid)" }}>Yael · Admin</span></div>}
        >
          <NavItem icon={<Ic n="Calendar" />} label="Schedule" active={tab==="schedule"} onClick={() => setTab("schedule")} />
          <NavItem icon={<Ic n="Users" />} label="Enrollments" badge="284" active={tab==="enroll"} onClick={() => setTab("enroll")} />
          <NavItem icon={<Ic n="ClipboardCheck" />} label="Attendance" active={tab==="att"} onClick={() => setTab("att")} />
          <NavSection>Admin</NavSection>
          <NavItem icon={<Ic n="LayoutDashboard" />} label="Dashboard" active={tab==="dash"} onClick={() => setTab("dash")} />
          <NavItem icon={<Ic n="Wallet" />} label="Payroll" active={tab==="pay"} onClick={() => setTab("pay")} />
          <NavItem icon={<Ic n="Settings" />} label="Settings" active={tab==="set"} onClick={() => setTab("set")} />
        </Sidebar>
        <div style={{ flex: 1 }}>
          <TopBar title="Schedule" subtitle="Summer 2026" actions={<><Button variant="secondary" size="sm">Today</Button><Button variant="primary" size="sm" icon={<Ic n="Plus" s={15} />}>New lesson</Button></>} />
          <div style={{ padding: 24, color: "var(--ink-soft)", fontSize: 14 }}>Workspace content area.</div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>

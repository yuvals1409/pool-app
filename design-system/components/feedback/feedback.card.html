<!-- @dsCard group="Components" viewport="700x300" name="Feedback — Cards, Toast, Empty" subtitle="Cards, KPI tiles, toast, empty state" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style> body { margin: 0; background: var(--canvas); padding: 22px 24px; } </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Card, KpiCard, Toast, EmptyState, Button } = window.StreamLineDesignSystem_132b60;
  const Ic = ({ n, s = 18 }) => { const ref = React.useRef(null); React.useEffect(() => { if (ref.current) { ref.current.innerHTML=""; const el = window.lucide.createElement(window.lucide.icons[n]); el.setAttribute("width", s); el.setAttribute("height", s); ref.current.appendChild(el); } }, [n]); return <span ref={ref} style={{ display: "inline-flex" }} />; };
  function Demo() {
    return (
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 14 }}>
        <KpiCard label="Active enrollments" value="284" delta="+12 this week" deltaUp icon={<Ic n="Users" />} />
        <KpiCard label="Lessons today" value="37" delta="-3" deltaUp={false} icon={<Ic n="Waves" />} />
        <KpiCard label="Attendance" value="92%" delta="+4%" deltaUp icon={<Ic n="ClipboardCheck" />} />
        <Card style={{ gridColumn: "span 1" }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: "var(--ink)", marginBottom: 4 }}>Card</div>
          <div style={{ fontSize: 13, color: "var(--ink-mid)" }}>White surface, hairline border, no shadow.</div>
        </Card>
        <div style={{ gridColumn: "span 1" }}><Toast message="Substitute saved" variant="success" onClose={() => {}} /></div>
        <Card padded={false} style={{ gridColumn: "span 1" }}>
          <EmptyState style={{ padding: "20px 12px" }} icon={<Ic n="CalendarOff" s={20} />} title="No lessons" description="Create one to get started." action={<Button size="sm">New lesson</Button>} />
        </Card>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>

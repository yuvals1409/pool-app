<!-- @dsCard group="Spacing" viewport="700x200" name="Elevation" subtitle="Border-first; faint warm shadows for floating UI" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); padding: 30px 28px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; }
  .item { text-align: center; }
  .box { width: 110px; height: 70px; background: var(--surface); border-radius: var(--radius-md); border: 1px solid var(--border); }
  .k { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); margin-top: 10px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:none">&nbsp;</div><div class="k">border only</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm);border-color:transparent"></div><div class="k">sm</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow);border-color:transparent"></div><div class="k">base</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md);border-color:transparent"></div><div class="k">md</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg);border-color:transparent"></div><div class="k">lg</div></div>
  </div>
</body>
</html>

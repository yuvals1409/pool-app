<!-- @dsCard group="Colors" viewport="700x180" name="Canvas & Ink" subtitle="Warm off-white surfaces + charcoal text" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); }
  .grid { display: flex; gap: 12px; padding: 24px 28px; flex-wrap: wrap; }
  .sw { width: 104px; }
  .chip { height: 60px; border-radius: var(--radius-md); border: 1px solid var(--border-strong); }
  .name { font-size: 12px; font-weight: 600; color: var(--ink); margin-top: 8px; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#FAFAF7"></div><div class="name">Canvas</div><div class="hex">#FAFAF7</div></div>
    <div class="sw"><div class="chip" style="background:#F6F5F1"></div><div class="name">Sidebar</div><div class="hex">#F6F5F1</div></div>
    <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="name">Surface</div><div class="hex">#FFFFFF</div></div>
    <div class="sw"><div class="chip" style="background:#F4F3EF"></div><div class="name">Sunk</div><div class="hex">#F4F3EF</div></div>
    <div class="sw"><div class="chip" style="background:#32302C"></div><div class="name">Ink</div><div class="hex">#32302C</div></div>
    <div class="sw"><div class="chip" style="background:#6B675F"></div><div class="name">Ink Mid</div><div class="hex">#6B675F</div></div>
    <div class="sw"><div class="chip" style="background:#9A958B"></div><div class="name">Ink Soft</div><div class="hex">#9A958B</div></div>
  </div>
</body>
</html>

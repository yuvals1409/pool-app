<!-- @dsCard group="Colors" viewport="700x150" name="Instructor Palette" subtitle="8 distinct hues for schedule blocks" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); }
  .row { display: flex; gap: 10px; padding: 28px; flex-wrap: wrap; }
  .sw { text-align: center; }
  .chip { width: 70px; height: 56px; border-radius: var(--radius-sm); border: 1px solid rgba(0,0,0,0.06); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft); margin-top: 6px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#0077B6"></div><div class="hex">instr-1</div></div>
    <div class="sw"><div class="chip" style="background:#2E9E6B"></div><div class="hex">instr-2</div></div>
    <div class="sw"><div class="chip" style="background:#6C5CE7"></div><div class="hex">instr-3</div></div>
    <div class="sw"><div class="chip" style="background:#E8722E"></div><div class="hex">instr-4</div></div>
    <div class="sw"><div class="chip" style="background:#0984E3"></div><div class="hex">instr-5</div></div>
    <div class="sw"><div class="chip" style="background:#C9881E"></div><div class="hex">instr-6</div></div>
    <div class="sw"><div class="chip" style="background:#8E7CFF"></div><div class="hex">instr-7</div></div>
    <div class="sw"><div class="chip" style="background:#15B4AC"></div><div class="hex">instr-8</div></div>
  </div>
</body>
</html>

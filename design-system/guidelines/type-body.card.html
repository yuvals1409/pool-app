<!-- @dsCard group="Type" viewport="700x240" name="Body & Labels" subtitle="Reading sizes, captions, overline" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); padding: 24px 28px; }
  .spec { display: flex; align-items: baseline; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .spec:last-child { border-bottom: 0; }
  .lbl { width: 130px; flex: none; font-size: 11px; color: var(--ink-soft); font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="spec"><span class="lbl">body · 15/400</span><span style="font-size:15px;color:var(--ink)">Private lesson with Yoav, today at 16:30.</span></div>
  <div class="spec"><span class="lbl">base · 14/400</span><span style="font-size:14px;color:var(--ink)">Table cells and dense UI use 14px.</span></div>
  <div class="spec"><span class="lbl">sm · 13/500</span><span style="font-size:13px;font-weight:500;color:var(--ink-mid)">Field label</span></div>
  <div class="spec"><span class="lbl">xs · 12/400</span><span style="font-size:12px;color:var(--ink-soft)">Caption and helper text</span></div>
  <div class="spec"><span class="lbl">overline · 11/600</span><span style="font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-soft)">Section</span></div>
</body>
</html>

<!-- @dsCard group="Spacing" viewport="700x180" name="8-point grid" subtitle="space-1 (4px) → space-8 (48px)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); padding: 26px 28px; }
  .row { display: flex; align-items: flex-end; gap: 18px; }
  .item { text-align: center; }
  .bar { background: var(--pool); border-radius: var(--radius-xs); width: 100%; }
  .k { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); margin-top: 8px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px;width:28px"></div><div class="k">1·4</div></div>
    <div class="item"><div class="bar" style="height:8px;width:28px"></div><div class="k">2·8</div></div>
    <div class="item"><div class="bar" style="height:12px;width:28px"></div><div class="k">3·12</div></div>
    <div class="item"><div class="bar" style="height:16px;width:28px"></div><div class="k">4·16</div></div>
    <div class="item"><div class="bar" style="height:24px;width:28px"></div><div class="k">5·24</div></div>
    <div class="item"><div class="bar" style="height:32px;width:28px"></div><div class="k">6·32</div></div>
    <div class="item"><div class="bar" style="height:40px;width:28px"></div><div class="k">7·40</div></div>
    <div class="item"><div class="bar" style="height:48px;width:28px"></div><div class="k">8·48</div></div>
  </div>
</body>
</html>

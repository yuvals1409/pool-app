<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing Scale" subtitle="8-point grid — space-1 (4px) through space-10 (64px)" -->
<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: #fff; padding: 20px 24px; }
  .grid { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--pool); border-radius: 3px; width: 28px; min-height: 2px; }
  .name { font-size: 10px; font-family: var(--font-mono); color: var(--ink-soft); }
  .px { font-size: 11px; font-family: var(--font-mono); font-weight: 600; color: var(--ink); }
</style>
</head>
<body>
<div class="grid">
  <div class="item"><div class="bar" style="height:4px"></div><div class="name">space-1</div><div class="px">4px</div></div>
  <div class="item"><div class="bar" style="height:8px"></div><div class="name">space-2</div><div class="px">8px</div></div>
  <div class="item"><div class="bar" style="height:12px"></div><div class="name">space-3</div><div class="px">12px</div></div>
  <div class="item"><div class="bar" style="height:16px"></div><div class="name">space-4</div><div class="px">16px</div></div>
  <div class="item"><div class="bar" style="height:24px"></div><div class="name">space-5</div><div class="px">24px</div></div>
  <div class="item"><div class="bar" style="height:32px"></div><div class="name">space-6</div><div class="px">32px</div></div>
  <div class="item"><div class="bar" style="height:40px"></div><div class="name">space-7</div><div class="px">40px</div></div>
  <div class="item"><div class="bar" style="height:48px"></div><div class="name">space-8</div><div class="px">48px</div></div>
  <div class="item"><div class="bar" style="height:64px"></div><div class="name">space-10</div><div class="px">64px</div></div>
</div>
</body>
</html>

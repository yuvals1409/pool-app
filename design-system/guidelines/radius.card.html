<!-- @dsCard group="Spacing" viewport="700x190" name="Radius scale" subtitle="3px chips → 16px hero · pill for badges" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); padding: 26px 28px; }
  .row { display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
  .item { text-align: center; }
  .box { width: 64px; height: 64px; background: var(--surface); border: 1px solid var(--border-strong); }
  .k { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); margin-top: 8px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:3px"></div><div class="k">xs·3</div></div>
    <div class="item"><div class="box" style="border-radius:4px"></div><div class="k">sm·4</div></div>
    <div class="item"><div class="box" style="border-radius:6px"></div><div class="k">·6</div></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="k">md·8</div></div>
    <div class="item"><div class="box" style="border-radius:12px"></div><div class="k">lg·12</div></div>
    <div class="item"><div class="box" style="border-radius:16px"></div><div class="k">xl·16</div></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><div class="k">pill</div></div>
  </div>
</body>
</html>

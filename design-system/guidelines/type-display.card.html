<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); padding: 24px 28px; }
  .spec { display: flex; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .spec:last-child { border-bottom: 0; }
  .lbl { width: 120px; flex: none; font-size: 11px; color: var(--ink-soft); font-family: var(--font-mono); }
  .t { color: var(--ink); }
</style>
</head>
<body>
  <div class="spec"><span class="lbl">display · 36/600</span><span class="t" style="font-size:36px;font-weight:600;letter-spacing:-0.02em">Lessons this week</span></div>
  <div class="spec"><span class="lbl">title-1 · 28/600</span><span class="t" style="font-size:28px;font-weight:600;letter-spacing:-0.012em">Schedule</span></div>
  <div class="spec"><span class="lbl">title-2 · 22/600</span><span class="t" style="font-size:22px;font-weight:600;letter-spacing:-0.012em">Enrollments</span></div>
  <div class="spec"><span class="lbl">title-3 · 18/600</span><span class="t" style="font-size:18px;font-weight:600">Active participants</span></div>
</body>
</html>

<!-- @dsCard group="Brand" viewport="700x220" name="Logo" subtitle="Wave mark + STREAM LINE wordmark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); }
  .wrap { display: flex; align-items: center; gap: 40px; padding: 28px 32px; }
  .mark { width: 132px; height: 132px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface); object-fit: contain; padding: 8px; }
  .meta { display: flex; flex-direction: column; gap: 8px; }
  .name { font-size: 22px; font-weight: 600; color: var(--ink); letter-spacing: var(--tracking-tight); }
  .sub { font-size: 14px; color: var(--ink-mid); }
  .chips { display: flex; gap: 8px; margin-top: 6px; }
  .chip { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-mid); border: 1px solid var(--border); background: var(--surface); padding: 5px 10px; border-radius: var(--radius-pill); }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="mark" src="../assets/stream-line-logo.jpeg" alt="Stream Line logo">
    <div class="meta">
      <div class="name">Stream Line · סטרים ליין</div>
      <div class="sub">Swimming-school management for Country Club Neve Oz, Petah Tikva.</div>
      <div class="chips">
        <span class="chip"><span class="dot" style="background:#0077B6"></span>Pool blue</span>
        <span class="chip"><span class="dot" style="background:#023E8A"></span>Deep navy</span>
        <span class="chip"><span class="dot" style="background:#E8722E"></span>Flame accent</span>
      </div>
    </div>
  </div>
</body>
</html>

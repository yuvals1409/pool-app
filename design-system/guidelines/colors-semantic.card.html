<!-- @dsCard group="Colors" viewport="700x180" name="Semantic — Status" subtitle="Success · Danger · Warn · Info with soft tints" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 24px 28px; }
  .cell { border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; background: var(--surface); }
  .solid { height: 42px; display: flex; align-items: center; padding: 0 14px; color: #fff; font-size: 13px; font-weight: 600; }
  .tint { padding: 8px 14px; font-size: 12px; }
  .hex { font-family: var(--font-mono); font-size: 11px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="solid" style="background:#2E9E6B">Success</div><div class="tint" style="background:#ECF7F0;color:#2E9E6B"><span class="hex">#2E9E6B</span></div></div>
    <div class="cell"><div class="solid" style="background:#D14343">Danger</div><div class="tint" style="background:#FCF0EF;color:#D14343"><span class="hex">#D14343</span></div></div>
    <div class="cell"><div class="solid" style="background:#C9881E">Warn</div><div class="tint" style="background:#FBF3E2;color:#C9881E"><span class="hex">#C9881E</span></div></div>
    <div class="cell"><div class="solid" style="background:#0077B6">Info</div><div class="tint" style="background:#EAF4FB;color:#0077B6"><span class="hex">#0077B6</span></div></div>
  </div>
</body>
</html>

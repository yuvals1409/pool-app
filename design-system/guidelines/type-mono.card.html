<!-- @dsCard group="Type" viewport="700x150" name="Mono — Numeric data" subtitle="IBM Plex Mono, tabular, LTR for times & IDs" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); padding: 24px 28px; }
  .row { display: flex; gap: 28px; flex-wrap: wrap; }
  .item { }
  .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 22px; color: var(--ink); }
  .k { font-size: 11px; color: var(--ink-soft); margin-top: 4px; font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="v">16:30</div><div class="k">time</div></div>
    <div class="item"><div class="v">19/06/2026</div><div class="k">date</div></div>
    <div class="item"><div class="v">054-812-3390</div><div class="k">phone</div></div>
    <div class="item"><div class="v">₪ 1,240</div><div class="k">amount</div></div>
    <div class="item"><div class="v">#A4F2-9K</div><div class="k">id / qr</div></div>
  </div>
</body>
</html>

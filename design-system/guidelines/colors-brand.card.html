<!-- @dsCard group="Colors" viewport="700x170" name="Brand — Pool Blue" subtitle="Primary brand ramp + flame accent" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); }
  .row { display: flex; gap: 12px; padding: 24px 28px; flex-wrap: wrap; }
  .sw { width: 96px; }
  .chip { height: 64px; border-radius: var(--radius-md); border: 1px solid rgba(0,0,0,0.06); }
  .name { font-size: 12px; font-weight: 600; color: var(--ink); margin-top: 8px; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#0077B6"></div><div class="name">Pool</div><div class="hex">#0077B6</div></div>
    <div class="sw"><div class="chip" style="background:#023E8A"></div><div class="name">Pool Deep</div><div class="hex">#023E8A</div></div>
    <div class="sw"><div class="chip" style="background:#0090D4"></div><div class="name">Pool Mid</div><div class="hex">#0090D4</div></div>
    <div class="sw"><div class="chip" style="background:#90E0EF"></div><div class="name">Pool Light</div><div class="hex">#90E0EF</div></div>
    <div class="sw"><div class="chip" style="background:#CAF0F8"></div><div class="name">Pool Pale</div><div class="hex">#CAF0F8</div></div>
    <div class="sw"><div class="chip" style="background:#E8722E"></div><div class="name">Accent Warm</div><div class="hex">#E8722E</div></div>
  </div>
</body>
</html>

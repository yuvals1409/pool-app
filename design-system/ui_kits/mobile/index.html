<!-- @dsCard group="Mobile App" viewport="390x760" name="Mobile PWA" subtitle="Parent ticket · Schedule · QR Scanner · Attendance" -->
<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* Force LIGHT mode preview regardless of OS dark setting */
html{color-scheme:light}
:root{
--pool:#0077B6;--pool-deep:#023E8A;--pool-mid:#0090D4;--pool-light:#90E0EF;--pool-pale:#CAF0F8;--pool-faint:#F0F8FF;
--surface:#F0F8FF;--white:#FFFFFF;--ink:#012A4A;--ink-mid:#2C6E8A;--ink-soft:#6BA3BE;--ink-faint:rgba(107,163,190,.5);
--success:#00B894;--success-bg:#EAFAF6;--danger:#D63031;--danger-bg:#FFF0F0;--warn:#FDCB6E;--warn-bg:#FFFBF0;--info:#0984E3;--info-bg:#EBF4FF;
--border:#C8E6F0;--separator:#C8E6F0;
--label:#012A4A;--label-secondary:#2C6E8A;--label-tertiary:#6BA3BE;
--bg:#FFFFFF;--bg-secondary:#F0F8FF;--bg-tertiary:#FFFFFF;--accent:#0077B6;
--nav-bg:rgba(255,255,255,.72);--nav-border:rgba(60,60,67,.12);--nav-inactive:rgba(60,60,67,.6);
--badge-pending-fg:#b7791f;--badge-admin-bg:#EDE9FE;--badge-admin-fg:#5B21B6;--badge-instructor-bg:rgba(0,119,182,.10);--badge-instructor-fg:#023E8A;--badge-guard-bg:rgba(0,184,148,.12);--badge-guard-fg:#059669;--badge-office-bg:#FFF7ED;--badge-office-fg:#C2410C;--badge-parent-bg:#CAF0F8;--badge-parent-fg:#023E8A;
}
html,body{height:100%;background:#e8edf2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","IBM Plex Sans Hebrew",sans-serif}
@keyframes sl-spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes scanLine{0%{top:8%}90%{top:88%}100%{top:88%;opacity:0}}
@keyframes scanPulse{0%,100%{border-color:#90E0EF}50%{border-color:#0077B6}}
@keyframes flash{0%{opacity:.7}100%{opacity:0}}
.phone{width:390px;min-height:760px;margin:0 auto;background:var(--surface);box-shadow:0 24px 80px rgba(0,0,0,.18);position:relative;display:flex;flex-direction:column;overflow:hidden}
.app-header{background:var(--bg-secondary);padding:12px 16px 14px;border-bottom:1px solid var(--separator);flex-shrink:0}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.header-logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--ink)}
.header-logo img{height:28px;width:auto}
.header-user{display:flex;align-items:center;gap:8px;margin-top:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--pool-pale);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--pool);border:1.5px solid var(--border)}
.content{flex:1;padding:20px 16px;padding-bottom:calc(49px + env(safe-area-inset-bottom,0px) + 20px);overflow-y:auto}
.tab-bar{position:fixed;bottom:0;inset-inline:0;max-width:390px;margin:0 auto;background:rgba(255,255,255,.82);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:1px solid rgba(60,60,67,.12);padding:4px 8px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;z-index:100}
.tab-btn{flex:1;padding:6px 4px 8px;background:none;border:none;border-radius:10px;cursor:pointer;font-family:inherit;font-size:10px;font-weight:500;color:rgba(60,60,67,.6);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px;-webkit-tap-highlight-color:transparent}
.tab-btn.active{color:#0077B6}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;font-family:ui-monospace,"IBM Plex Mono",monospace}
.badge-active{background:#EAFAF6;color:#00B894}
.badge-pending{background:#FFFBF0;color:#b7791f}
.badge-cancelled{background:#FFF0F0;color:#D63031}
.badge-parent{background:var(--badge-parent-bg);color:var(--badge-parent-fg)}
.badge-guard{background:var(--badge-guard-bg);color:var(--badge-guard-fg)}
.badge-instructor{background:var(--badge-instructor-bg);color:var(--badge-instructor-fg)}
.badge-admin{background:var(--badge-admin-bg);color:var(--badge-admin-fg)}
.btn{width:100%;padding:12px 16px;border:none;border-radius:10px;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn-primary{background:linear-gradient(135deg,#0077B6,#023E8A);color:#fff;box-shadow:0 4px 16px rgba(0,119,182,.28)}
.btn-secondary{background:#fff;color:#012A4A;border:1.5px solid #C8E6F0}
.btn-whatsapp{background:#25D366;color:#fff}
.card{background:#fff;border:1px solid var(--separator);border-radius:16px;padding:16px;margin-bottom:16px}
.section-title{font-size:22px;font-weight:700;color:var(--ink);margin-bottom:4px}
.section-sub{font-size:15px;color:var(--ink-mid);margin-bottom:20px}
.lesson-info-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:15px;border-bottom:1px solid var(--pool-light)}
.lesson-info-row:last-child{border-bottom:none}
.li-key{color:var(--ink-mid);font-weight:500}
.li-val{font-weight:600;color:var(--ink)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const LESSON = { child: 'נועה כהן', instructor: 'יובל לוי', date: 'יום שלישי, 24/06/2026', time: '16:30', duration: '30 דקות', location: 'קאנטרי נווה עוז', status: 'active' };
const SCHEDULE = [
  { id:1, name:'נועה כהן',    instructor:'יובל',  time:'16:00', day:1, dur:2, color:'#0077B6' },
  { id:2, name:'אורי שמש',    instructor:'דנה',   time:'16:30', day:1, dur:2, color:'#00B894' },
  { id:3, name:'מיה גולן',    instructor:'יובל',  time:'15:00', day:2, dur:2, color:'#0077B6' },
  { id:4, name:'תום פרידמן',  instructor:'משה',   time:'16:00', day:2, dur:2, color:'#6C5CE7' },
  { id:5, name:'שני דוידוב',  instructor:'דנה',   time:'16:30', day:3, dur:2, color:'#00B894' },
  { id:6, name:'ליאם ברגר',   instructor:'רחל',   time:'14:00', day:3, dur:2, color:'#E17055' },
  { id:7, name:'נועה כהן',    instructor:'יובל',  time:'16:00', day:4, dur:2, color:'#0077B6' },
  { id:8, name:'אבי כץ',      instructor:'משה',   time:'17:00', day:4, dur:2, color:'#6C5CE7' },
  { id:9, name:'רונן אבי',    instructor:'דנה',   time:'15:30', day:5, dur:2, color:'#00B894' },
];
const DAYS = ['א׳','ב׳','ג׳','ד׳','ה׳'];
const HOURS = ['14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30'];
const USERS = [
  { name:'יובל לוי', role:'מדריך', initial:'יל', color:'#0077B6' },
  { name:'דנה אברהם', role:'מדריכה', initial:'דא', color:'#00B894' },
  { name:'משה בן דוד', role:'מדריך', initial:'מב', color:'#6C5CE7' },
  { name:'רחל כץ', role:'מדריכה', initial:'רכ', color:'#E17055' },
  { name:'שומר 1', role:'שומר', initial:'ש', color:'#FDCB6E' },
];

function QRCode() {
  const cells = Array.from({length:21*21},(_, i)=>{
    const r=Math.floor(i/21),c=i%21;
    const inCorner=(r<7&&c<7)||(r<7&&c>13)||(r>13&&c<7);
    const edge=(r===0||r===6||r===20||c===0||c===6||c===20||r===14||(r<7&&(c===6||c===0))||(c<7&&(r===6||r===0))||(r<7&&c>13&&(c===14||c===20||r===6||r===0))||(r>13&&c<7&&(c===6||c===0||r===14||r===20)));
    const inner=inCorner&&!edge&&r>1&&r<5&&c>1&&c<5&&r!==2&&c!==2&&r!==4&&c!==4;
    const rand=Math.sin(i*137.508)*0.5+0.5;
    return (edge||inner||(rand>0.62&&!inCorner))?1:0;
  });
  return (
    <svg viewBox="0 0 21 21" width="160" height="160" shapeRendering="crispEdges">
      {cells.map((v,i)=>v?<rect key={i} x={i%21} y={Math.floor(i/21)} width={1} height={1} fill="#012A4A"/>:null)}
    </svg>
  );
}

function LoginScreen({onLogin}) {
  return (
    <div style={{minHeight:'100%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'32px 24px',background:'var(--surface)',animation:'fadeIn .3s ease'}}>
      <img src="../../assets/stream-line-logo.jpeg" alt="Stream Line" style={{height:100,width:'auto',marginBottom:20,borderRadius:8}}/>
      <div style={{fontSize:'22px',fontWeight:700,color:'var(--ink)',marginBottom:4,textAlign:'center'}}>בית ספר לשחייה Stream Line</div>
      <div style={{fontSize:'15px',color:'var(--ink-mid)',marginBottom:32,textAlign:'center'}}>קאנטרי נווה עוז · פתח תקווה</div>
      <div style={{width:'100%',maxWidth:320,background:'#fff',borderRadius:16,padding:'24px 20px',boxShadow:'0 8px 40px rgba(0,119,182,.16)',border:'1px solid var(--border)'}}>
        <div style={{display:'flex',gap:4,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:999,padding:3,marginBottom:20}}>
          {['עברית','English','Русский'].map((l,i)=>(
            <button key={l} style={{flex:1,padding:'4px 8px',border:'none',borderRadius:999,fontFamily:'inherit',fontSize:12,fontWeight:600,cursor:'pointer',background:i===0?'var(--accent)':'transparent',color:i===0?'#fff':'var(--label-secondary)',transition:'all .15s'}}>
              {l}
            </button>
          ))}
        </div>
        <button onClick={onLogin} className="btn btn-primary" style={{marginBottom:12}}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          כניסה עם Google
        </button>
        <div style={{fontSize:13,color:'var(--ink-soft)',textAlign:'center',lineHeight:1.5}}>לאחר ההתחברות, מנהל המערכת יאשר את חשבונך</div>
      </div>
    </div>
  );
}

function TicketScreen() {
  return (
    <div style={{animation:'fadeIn .25s ease'}}>
      <div className="section-title">כרטיס כניסה</div>
      <div className="section-sub">הצג את הקוד בכניסה לשיעור</div>
      <div className="card" style={{textAlign:'center',padding:'20px 16px'}}>
        <div style={{display:'inline-flex',background:'var(--pool-pale)',borderRadius:12,padding:12,marginBottom:12}}>
          <QRCode />
        </div>
        <div style={{fontSize:13,color:'var(--ink-mid)',fontWeight:500}}>QR תקף לכניסה לשיעור הבא</div>
      </div>
      <div className="card" style={{background:'var(--pool-pale)',border:'1px solid var(--pool-light)',padding:'16px'}}>
        {[['ילד/ה',LESSON.child],['מדריך',LESSON.instructor],['תאריך',LESSON.date],['שעה',LESSON.time],['משך',LESSON.duration],['מיקום',LESSON.location]].map(([k,v])=>(
          <div key={k} className="lesson-info-row">
            <span className="li-key">{k}</span>
            <span className="li-val" dir={['שעה','תאריך'].includes(k)?'ltr':'rtl'}>{v}</span>
          </div>
        ))}
      </div>
      <div style={{display:'flex',gap:8,marginTop:4}}>
        <button className="btn btn-whatsapp" style={{flex:1,fontSize:15}}>📲 שלח ב-WhatsApp</button>
        <button className="btn btn-secondary" style={{flex:1,fontSize:15}}>הוסף ליומן</button>
      </div>
    </div>
  );
}

function ScheduleScreen() {
  const slotH = 28;
  const hourToSlot = t => { const [h,m]=t.split(':').map(Number); return (h-14)*2+(m>=30?1:0); };
  return (
    <div style={{animation:'fadeIn .25s ease'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
        <div className="section-title" style={{marginBottom:0}}>לו"ז השבוע</div>
        <span style={{fontSize:13,color:'var(--ink-mid)',fontFamily:'ui-monospace,"IBM Plex Mono",monospace',direction:'ltr'}}>23–27/06</span>
      </div>
      <div style={{background:'var(--border)',borderRadius:16,overflow:'hidden',boxShadow:'var(--shadow)'}}>
        <div style={{display:'flex',gap:1}}>
          <div style={{width:40,flexShrink:0}}></div>
          {DAYS.map((d,i)=>(
            <div key={d} style={{flex:1,padding:'8px 4px',textAlign:'center',fontSize:11,fontWeight:700,color:i===1?'var(--pool)':'var(--ink-mid)',background:i===1?'rgba(0,119,182,.06)':'var(--surface)'}}>
              <div>{d}</div><div style={{fontFamily:'ui-monospace,"IBM Plex Mono",monospace',fontSize:13,marginTop:2,fontWeight:700}}>{23+i}</div>
            </div>
          ))}
        </div>
        <div style={{display:'flex',gap:1}}>
          <div style={{width:40,flexShrink:0,display:'flex',flexDirection:'column',gap:1}}>
            {HOURS.map(h=>(
              <div key={h} style={{height:slotH,background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:'var(--ink-soft)',fontFamily:'ui-monospace,"IBM Plex Mono",monospace',direction:'ltr'}}>{h}</div>
            ))}
          </div>
          {DAYS.map((_,di)=>(
            <div key={di} style={{flex:1,position:'relative',display:'flex',flexDirection:'column',gap:1}}>
              {HOURS.map(h=><div key={h} style={{height:slotH,background:'#fff'}}></div>)}
              {SCHEDULE.filter(l=>l.day===di+1).map(l=>(
                <div key={l.id} style={{position:'absolute',top:hourToSlot(l.time)*slotH+hourToSlot(l.time),left:2,right:2,height:l.dur*slotH-2,background:l.color,borderRadius:4,padding:'2px 4px',fontSize:10,fontWeight:600,color:'#fff',overflow:'hidden',lineHeight:1.25,cursor:'pointer'}}>
                  <div>{l.name}</div>
                  <div style={{opacity:.85,fontFamily:'ui-monospace,"IBM Plex Mono",monospace',direction:'ltr',fontSize:9}}>{l.time}</div>
                </div>
              ))}
            </div>
          ))}
        </div>
      </div>
      <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:12}}>
        {[{c:'#0077B6',n:'יובל'},{c:'#00B894',n:'דנה'},{c:'#6C5CE7',n:'משה'},{c:'#E17055',n:'רחל'}].map(i=>(
          <div key={i.n} style={{display:'flex',alignItems:'center',gap:5,background:'#fff',border:'1px solid var(--border)',borderRadius:20,padding:'3px 10px',fontSize:11,fontWeight:600}}>
            <div style={{width:8,height:8,borderRadius:'50%',background:i.c,flexShrink:0}}></div>{i.n}
          </div>
        ))}
      </div>
    </div>
  );
}

function ScanScreen() {
  const [result, setResult] = useState(null);
  return (
    <div style={{animation:'fadeIn .25s ease'}}>
      <div className="section-title">סריקת כניסה</div>
      <div className="section-sub">סרוק את QR הכניסה של החניך</div>
      {!result ? (
        <>
          <div style={{position:'relative',borderRadius:16,overflow:'hidden',background:'#000',aspectRatio:'1',marginBottom:12}}>
            <div style={{position:'absolute',inset:0,background:'linear-gradient(135deg,#012A4A 0%,#0077B6 100%)',opacity:.7}}></div>
            <div style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',width:'62%',aspectRatio:'1',border:'2.5px solid #90E0EF',borderRadius:10,boxShadow:'0 0 0 999px rgba(0,0,0,.4)',animation:'scanPulse 2s ease-in-out infinite'}}>
              <div style={{position:'absolute',left:'8%',right:'8%',height:2,background:'#90E0EF',animation:'scanLine 2s linear infinite'}}></div>
            </div>
            <div style={{position:'absolute',bottom:16,left:0,right:0,textAlign:'center',color:'rgba(255,255,255,.8)',fontSize:13}}>כוון את המצלמה לקוד QR</div>
          </div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-primary" onClick={()=>setResult('ok')} style={{flex:1}}>סמלץ ✓ כניסה</button>
            <button className="btn btn-secondary" onClick={()=>setResult('err')} style={{flex:1}}>סמלץ ✗ שגיאה</button>
          </div>
        </>
      ) : (
        <div style={{borderRadius:16,padding:'28px 16px',textAlign:'center',background:result==='ok'?'var(--success-bg)':'var(--danger-bg)',border:`2px solid ${result==='ok'?'var(--success)':'var(--danger)'}`}}>
          <div style={{fontSize:52,marginBottom:12}}>{result==='ok'?'✅':'❌'}</div>
          <div style={{fontSize:22,fontWeight:700,color:result==='ok'?'var(--success)':'var(--danger)',marginBottom:8}}>{result==='ok'?'כניסה מאושרת!':'כניסה נדחתה'}</div>
          <div style={{fontSize:15,color:'var(--ink-mid)',marginBottom:20,lineHeight:1.5}}>{result==='ok'?'ברוך הבא, נועה כהן\nשיעור עם יובל • 16:30':'כרטיס לא בתוקף\nפנה לצוות ההדרכה'}</div>
          <button className="btn btn-secondary" onClick={()=>setResult(null)}>סריקה חדשה</button>
        </div>
      )}
    </div>
  );
}

function AdminScreen() {
  return (
    <div style={{animation:'fadeIn .25s ease'}}>
      <div className="section-title">ניהול משתמשים</div>
      <div className="section-sub">מדריכים, שומרים וצוות</div>
      <div style={{background:'#fff',border:'1px solid var(--separator)',borderRadius:16,overflow:'hidden',marginBottom:16}}>
        {USERS.map((u,i)=>(
          <div key={u.name} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',borderBottom:i<USERS.length-1?'1px solid var(--separator)':'none',minHeight:44}}>
            <div style={{width:38,height:38,borderRadius:'50%',background:u.color+'22',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:700,color:u.color,flexShrink:0}}>{u.initial}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:15,color:'var(--ink)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{u.name}</div>
              <div style={{fontSize:12,color:'var(--ink-mid)',marginTop:2}}>{u.role}</div>
            </div>
            <span className="badge" style={{background:u.color+'22',color:u.color}}>{u.role}</span>
          </div>
        ))}
      </div>
      <button className="btn btn-primary">+ הוסף משתמש חדש</button>
    </div>
  );
}

function HistoryScreen() {
  const log = [
    {name:'נועה כהן',   time:'16:32', ok:true,  instr:'יובל'},
    {name:'אורי שמש',   time:'16:05', ok:true,  instr:'דנה'},
    {name:'תום פרידמן', time:'15:58', ok:false, instr:'—'},
    {name:'מיה גולן',   time:'15:01', ok:true,  instr:'משה'},
    {name:'ליאם ברגר',  time:'14:03', ok:true,  instr:'רחל'},
  ];
  return (
    <div style={{animation:'fadeIn .25s ease'}}>
      <div className="section-title">היסטוריית סריקות</div>
      <div className="section-sub">כניסות אחרונות — היום</div>
      <div className="card" style={{padding:0,overflow:'hidden'}}>
        {log.map((l,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',borderBottom:i<log.length-1?'1px solid var(--separator)':'none'}}>
            <div style={{width:10,height:10,borderRadius:'50%',background:l.ok?'var(--success)':'var(--danger)',flexShrink:0}}></div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:600,fontSize:15,color:'var(--ink)'}}>{l.name}</div>
              <div style={{fontSize:12,color:'var(--ink-mid)',marginTop:2}}>מדריך: {l.instr}</div>
            </div>
            <div style={{textAlign:'left'}}>
              <div style={{fontFamily:'ui-monospace,"IBM Plex Mono",monospace',fontSize:13,color:'var(--ink)',direction:'ltr'}}>{l.time}</div>
              <span className="badge" style={{background:l.ok?'var(--success-bg)':'var(--danger-bg)',color:l.ok?'var(--success)':'var(--danger)',marginTop:2,fontSize:11}}>{l.ok?'כניסה':'נדחה'}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function AttendanceScreen() {
  const roster = ['נועה כהן','אורי שמש','מיה גולן','תום פרידמן','שני דוידוב'];
  const [present, setPresent] = useState({0:true,1:true});
  const count = Object.values(present).filter(Boolean).length;
  return (
    <div style={{animation:'fadeIn .25s ease'}}>
      <div className="section-title">סימון נוכחות</div>
      <div className="section-sub">שיעור קבוצתי · יום שלישי 16:00</div>
      <div className="card" style={{padding:0,overflow:'hidden',marginBottom:16}}>
        {roster.map((name,i)=>(
          <button key={i} onClick={()=>setPresent(p=>({...p,[i]:!p[i]}))} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',borderBottom:i<roster.length-1?'1px solid var(--separator)':'none',width:'100%',background:present[i]?'var(--success-bg)':'transparent',border:'none',cursor:'pointer',fontFamily:'inherit',textAlign:'start',minHeight:44}}>
            <div style={{width:24,height:24,borderRadius:'50%',border:`2px solid ${present[i]?'var(--success)':'var(--border)'}`,background:present[i]?'var(--success)':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,color:'#fff',fontSize:14}}>{present[i]?'✓':''}</div>
            <div style={{flex:1,fontWeight:600,fontSize:15,color:'var(--ink)'}}>{name}</div>
            <span style={{fontSize:12,color:present[i]?'var(--success)':'var(--ink-soft)',fontWeight:600}}>{present[i]?'נוכח':'נעדר'}</span>
          </button>
        ))}
      </div>
      <button className="btn btn-primary">שמור נוכחות ({count}/{roster.length})</button>
    </div>
  );
}

const TAB_ICONS = {
  ticket: <svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>,
  schedule: <svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
  scan: <svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>,
  history: <svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
  attendance: <svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>,
  admin: <svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>,
};

// Role → which tabs that role can see (matches permissions.js in pool-app)
const ROLE_TABS = {
  parent:     ['ticket','schedule'],
  guard:      ['scan','history'],
  instructor: ['ticket','schedule','attendance'],
  admin:      ['ticket','schedule','scan','attendance','admin'],
};
const TAB_LABEL = { ticket:'שיעור', schedule:'לו"ז', scan:'סריקה', history:'היסטוריה', attendance:'נוכחות', admin:'ניהול' };
const ROLE_LABEL = { parent:'הורה', guard:'שומר', instructor:'מדריך', admin:'מנהל' };
const ROLE_USER  = {
  parent:     {name:'נועה כהן', initial:'נכ'},
  guard:      {name:'גל שמש',   initial:'גש'},
  instructor: {name:'יובל לוי', initial:'יל'},
  admin:      {name:'יובל ס.',  initial:'יס'},
};
const ROLE_BADGE = { parent:'badge-parent', guard:'badge-guard', instructor:'badge-instructor', admin:'badge-admin' };

function App() {
  const [loggedIn, setLoggedIn] = useState(false);
  const [role, setRole] = useState('parent');
  const tabs = ROLE_TABS[role];
  const [tab, setTab] = useState(tabs[0]);
  React.useEffect(()=>{ setTab(ROLE_TABS[role][0]); }, [role]);

  const SCREENS = { ticket:<TicketScreen/>, schedule:<ScheduleScreen/>, scan:<ScanScreen/>, history:<HistoryScreen/>, attendance:<AttendanceScreen/>, admin:<AdminScreen/> };
  const user = ROLE_USER[role];

  if (!loggedIn) return (
    <div style={{minHeight:'100vh',background:'#e8edf2',display:'flex',justifyContent:'center',padding:'20px 0'}}>
      <div className="phone"><LoginScreen onLogin={()=>setLoggedIn(true)}/></div>
    </div>
  );

  return (
    <div style={{minHeight:'100vh',background:'#e8edf2',display:'flex',flexDirection:'column',alignItems:'center',gap:14,padding:'20px 0'}}>
      {/* Demo-only role switcher */}
      <div style={{display:'flex',alignItems:'center',gap:6,background:'#fff',borderRadius:999,padding:'6px 8px',boxShadow:'0 4px 16px rgba(0,0,0,.1)',flexWrap:'wrap',justifyContent:'center',maxWidth:390}}>
        <span style={{fontSize:11,color:'#6BA3BE',fontWeight:600,paddingInlineStart:6}}>תצוגת דמו:</span>
        {Object.keys(ROLE_TABS).map(r=>(
          <button key={r} onClick={()=>setRole(r)} style={{padding:'5px 12px',border:'none',borderRadius:999,fontFamily:'inherit',fontSize:12,fontWeight:600,cursor:'pointer',background:role===r?'#0077B6':'transparent',color:role===r?'#fff':'#2C6E8A',transition:'all .15s'}}>{ROLE_LABEL[r]}</button>
        ))}
      </div>
      <div className="phone">
        <div className="app-header">
          <div className="header-top">
            <div className="header-logo"><img src="../../assets/stream-line-logo.jpeg" alt="Stream Line" style={{height:32,width:'auto',borderRadius:4}}/>Stream Line</div>
            <span className={`badge ${ROLE_BADGE[role]}`}>{ROLE_LABEL[role]}</span>
          </div>
          <div className="header-user">
            <div className="avatar">{user.initial}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:15,fontWeight:600,color:'var(--ink)'}}>{user.name}</div>
              <div style={{fontSize:13,color:'var(--ink-mid)'}}>בית ספר לשחייה Stream Line</div>
            </div>
            <button style={{background:'var(--bg-secondary)',border:'1px solid var(--separator)',color:'var(--label)',padding:'6px 12px',borderRadius:999,fontSize:13,cursor:'pointer',fontFamily:'inherit',minHeight:44,fontWeight:500}}>התנתק</button>
          </div>
        </div>
        <div className="content">{SCREENS[tab]}</div>
        <div className="tab-bar">
          {tabs.map(id=>(
            <button key={id} className={`tab-btn${tab===id?' active':''}`} onClick={()=>setTab(id)}>
              <span style={{width:24,height:24,display:'flex',alignItems:'center',justifyContent:'center'}}>{React.cloneElement(TAB_ICONS[id],{fill:tab===id?'currentColor':'none',strokeWidth:tab===id?1.75:2})}</span>
              {TAB_LABEL[id]}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

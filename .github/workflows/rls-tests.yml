name: RLS Tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/rls-supashield.mjs"
      - ".github/workflows/rls-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/rls-supashield.mjs"
      - ".github/workflows/rls-tests.yml"

permissions:
  contents: read

jobs:
  rls:
    name: SupaShield RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Reset database
        run: supabase db reset

      - name: Export local Supabase env
        run: |
          eval "$(supabase status -o env)"
          supabase status -o env >> "$GITHUB_ENV"
          {
            echo "DATABASE_URL=${POSTGRES_URL}"
            echo "SUPASHIELD_DATABASE_URL=${POSTGRES_URL}"
            echo "SUPABASE_URL=${API_URL}"
            echo "VITE_SUPABASE_URL=${API_URL}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "CI=true"
          } >> "$GITHUB_ENV"

      - name: Seed demo users
        run: npm run seed:demo

      - name: Run SupaShield domain RLS tests
        run: npm run db:rls

      - name: Run SupaShield audit
        run: npm run db:rls:audit

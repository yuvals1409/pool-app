name: Snyk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk-deps:
    name: Snyk Open Source
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Skip when SNYK_TOKEN is not configured
        if: ${{ env.SNYK_TOKEN == '' }}
        run: echo "::notice::SNYK_TOKEN is not configured; skipping Snyk Open Source scan."

      - uses: actions/checkout@v4
        if: ${{ env.SNYK_TOKEN != '' }}

      - uses: actions/setup-node@v6
        if: ${{ env.SNYK_TOKEN != '' }}
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: ${{ env.SNYK_TOKEN != '' }}

      - name: Run Snyk dependency scan
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high --fail-on=upgradable

  snyk-code:
    name: Snyk Code
    runs-on: ubuntu-latest
    if: ${{ vars.SNYK_CODE_ENABLED == 'true' }}
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Skip when SNYK_TOKEN is not configured
        if: ${{ env.SNYK_TOKEN == '' }}
        run: echo "::notice::SNYK_TOKEN is not configured; skipping Snyk Code scan."

      - uses: actions/checkout@v4
        if: ${{ env.SNYK_TOKEN != '' }}

      - name: Run Snyk Code scan
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=high

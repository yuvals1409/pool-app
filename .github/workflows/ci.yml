name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_QR_TOKEN: ${{ secrets.E2E_QR_TOKEN }}
      E2E_SEARCH_PHONE: ${{ secrets.E2E_SEARCH_PHONE }}
      E2E_LESSON_ID: ${{ secrets.E2E_LESSON_ID }}
      E2E_PASS_TOKEN: ${{ secrets.E2E_PASS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Verify PWA build artifacts
        run: test -f dist/sw.js && test -f dist/manifest.webmanifest

      - name: Check E2E secrets
        id: e2e
        run: |
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Supabase secrets not available; skipping E2E tests."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npx playwright install --with-deps chromium
        if: steps.e2e.outputs.enabled == 'true'

      - name: Prepare E2E database
        if: steps.e2e.outputs.enabled == 'true'
        run: |
          node scripts/verify-supabase-ci.mjs
          npm run seed:demo
          npm run seed:e2e

      - name: E2E tests
        if: steps.e2e.outputs.enabled == 'true'
        run: npm run test:e2e

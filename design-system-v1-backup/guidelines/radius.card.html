<!-- @dsCard group="Spacing" viewport="700x130" name="Radius & Borders" subtitle="Border radius scale — xs chip through pill CTA" -->
<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: #fff; padding: 20px 24px; }
  .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .box { width: 52px; height: 52px; background: var(--pool-pale); border: 2px solid var(--pool-light); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; }
  .name { font-size: 10px; font-family: var(--font-mono); color: var(--ink-soft); }
  .val { font-size: 11px; font-family: var(--font-mono); font-weight: 600; color: var(--pool-deep); }
</style>
</head>
<body>
<div class="row">
  <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="name">--radius-xs</div><div class="val">4px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="name">--radius-sm</div><div class="val">8px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius)"></div><div class="name">--radius</div><div class="val">10px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-card)"></div><div class="name">--radius-card</div><div class="val">16px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="name">--radius-xl</div><div class="val">20px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="name">--radius-2xl</div><div class="val">24px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-pill)"></div><div class="name">--radius-pill</div><div class="val">999px</div></div>
</div>
</body>
</html>
